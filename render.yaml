services:
  - type: web
    name: indirag-qa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: INDIRAG_PRODUCTION
        value: "true"
      - key: INDIRAG_AUTH_ENABLED
        value: "true"
      - key: INDIRAG_TEAM_PASSWORD
        sync: false
      - key: INDIRAG_SESSION_SECRET
        sync: false
      - key: INDIRAG_DATA_DIR
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: ALLOWED_ORIGINS
        sync: false
